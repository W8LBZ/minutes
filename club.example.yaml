# Copy to club.yaml (local only, git-ignored) and fill in.
# People will come from the roster Google Sheet; the members section is a stopgap.

club:
  name: Example Radio Club
  callsign: W0XYZ
  meeting_day: Thursday

links:  # shown in the "Club Links" footer of the minutes
  - label: Teams meeting
    url: https://teams.live.com/meet/REPLACE_ME
  - label: Club Discord
    url: https://discord.com/invite/REPLACE_ME

roster:  # the club roster Google Sheet (share it with the service account as Viewer)
  sheet_id: REPLACE_ME
  tab: Member Roster

privacy:
  never_record: []  # names never shown in minutes or the archive

# People come from the roster Google Sheet (`w8lbz-minutes roster`).
# Temporary overrides, keyed by lowercase callsign, for columns the sheet lacks:
overrides:
  kd8xyz: {minutes_role: leader, aliases: [Doh]}
