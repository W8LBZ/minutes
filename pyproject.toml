[project]
name = "w8lbz-minutes"
version = "0.3.0"
description = "Meeting minutes, attendance and club records for the W8LBZ amateur radio club"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Jim Flattery" }]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "google-auth[requests]>=2.62.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "markdown>=3.11.3",
    "openpyxl>=3.1.5",
    "pypdf>=7.0.0",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
    "weasyprint>=70.0",
    "webauthn>=3.0.1",
]

[project.scripts]
w8lbz-minutes = "w8lbz_minutes:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "playwright>=1.64.1",
    "pytest>=9.2.0",
]
