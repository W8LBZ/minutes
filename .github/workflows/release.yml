# Tag a release when a version bump lands on main.
#
# Releasing: in a PR, rename CHANGELOG's "Unreleased" to "X.Y.Z (date)", set `version = "X.Y.Z"` in
# pyproject.toml and run `uv lock`. When it merges, this tags the merge commit vX.Y.Z and publishes
# a GitHub release whose notes are that version's CHANGELOG section. Pushes that don't change the
# version do nothing, so it's safe on every push.
name: Release
on:
  push:
    branches: [main]
    paths: [pyproject.toml]
permissions:
  contents: write
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read the version
        id: v
        run: |
          v=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then echo "exists=true" >> "$GITHUB_OUTPUT"; fi
      - name: Release notes from CHANGELOG.md
        if: steps.v.outputs.exists != 'true'
        run: |
          awk -v v="${{ steps.v.outputs.version }}" '
            /^## / { if (on) exit; if (index($0, "## " v " ") == 1 || $0 == "## " v) { on = 1; next } }
            on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "CHANGELOG.md has no section for ${{ steps.v.outputs.version }}" >&2; exit 1; fi
      - name: Tag and publish
        if: steps.v.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.v.outputs.version }}" --target "$GITHUB_SHA" --title "v${{ steps.v.outputs.version }}" --notes-file notes.md
