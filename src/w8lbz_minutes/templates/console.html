{% extends "base.html" %}{% block title %}Console {{ m.date }}{% endblock %}{% block body %}
<link rel="stylesheet" href="/static/console.css">
<div class="ch">
  <div><h1>Meeting of {{ m.date|longdate }}</h1>
  Led by <select id="leader">{% for id in leaders %}<option value="{{ id }}" {{ 'selected' if id == m.leader }}>{{ club.name(id) }}</option>{% endfor %}</select>
  <button type="button" class="share" id="share" data-path="/meetings/{{ m.slug }}"
    title="Members can follow along live at this link: the minutes on it update every few seconds as you take them. Paste it in the Teams chat. They sign in like they do for the archive. Click to copy.">🔗 Share live view</button>
  <a class="muted small" href="/meetings/{{ m.slug }}" target="_blank" title="Open the live view in a new tab">open ↗</a></div>
  <div id="saved" class="saved">Saved</div>
</div>
<nav id="steps" class="steps"></nav>
<section id="panel"></section>
<div class="pager"><button id="prev" class="btn ghost">◀ Back</button><button id="next" class="btn">Next ▶</button></div>
<form id="submitform" method="post" action="/console/{{ m.slug }}/submit"></form>
<form method="post" action="/console/{{ m.slug }}/discard" onsubmit="return confirm('Discard this draft completely? This cannot be undone.')" style="text-align:right">
  <button class="btn small ghost" type="submit">Discard draft</button></form>
<script>window.CONSOLE = {{ data|safe }};</script>
<script src="/static/console.js"></script>
<script>
document.getElementById("share").addEventListener("click", async (e) => {
  const b = e.currentTarget, url = location.origin + b.dataset.path;
  try { await navigator.clipboard.writeText(url); }   // needs HTTPS; the LAN address falls back to a prompt
  catch { window.prompt("Copy this link:", url); return; }
  const was = b.textContent; b.textContent = "✓ Link copied"; b.classList.add("ok");
  setTimeout(() => { b.textContent = was; b.classList.remove("ok"); }, 2000);
});
</script>
{% endblock %}
