{# Simple line icons (24x24, stroke = currentColor) for the Links page. #}
{% macro icon(name) %}<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if name == 'video' %}<rect x="2.5" y="6" width="13" height="12" rx="2"/><path d="M15.5 10.5 21.5 7v10l-6-3.5"/>
{% elif name == 'chat' %}<path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-9l-5 4v-4H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/><path d="M8 10h8M8 13h5"/>
{% elif name == 'globe' %}<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.8 5.5 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.5-3.8-9S9.5 5.5 12 3z"/>
{% elif name == 'document' %}<path d="M6 2.5h8l4.5 4.5v14a.5.5 0 0 1-.5.5H6a.5.5 0 0 1-.5-.5v-18A.5.5 0 0 1 6 2.5z"/><path d="M14 2.5V7h4.5M8.5 12h7M8.5 15h7M8.5 18h4.5"/>
{% elif name == 'radio' %}<rect x="3" y="9" width="18" height="12" rx="2"/><path d="M7 9 17 3"/><circle cx="15.5" cy="15" r="2.5"/><path d="M6.5 13.5h4M6.5 16.5h4"/>
{% elif name == 'calendar' %}<rect x="3" y="4.5" width="18" height="16.5" rx="2"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/>
{% else %}<path d="M10 14a4 4 0 0 0 5.7 0l3.5-3.5a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3.5 3.5a4 4 0 0 0 5.7 5.7l1-1"/>{% endif %}
</svg>{% endmacro %}
